<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Vier op een rij</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1f5c">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="stylesheet" href="../shared.css">
<style>
  .stage { display: flex; flex-direction: column; align-items: center; padding: 0 12px 14px; }
  #score { display: flex; gap: 10px; width: 100%; max-width: 460px; margin: 2px 0 6px; }
  #score div { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,.14); border-radius: 18px; padding: 6px 0; font-weight: 900; font-size: 22px; }
  .dot { display: inline-block; width: 24px; height: 24px; border-radius: 50%; }
  .p1 { background: radial-gradient(circle at 35% 30%, #ff9a9a, #e62b2b); }
  .p2 { background: radial-gradient(circle at 35% 30%, #fff08a, #f2b800); }
  #msg { font-size: 22px; font-weight: 900; min-height: 34px; margin: 2px 0 8px; text-align: center; }
  #wrap { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
  #board { width: min(100%, 460px); aspect-ratio: 7 / 6; display: grid; grid-template-columns: repeat(7, 1fr); background: #2d5bff; border-radius: 20px; padding: 6px; box-shadow: inset 0 -8px 0 rgba(0,0,0,.25), 0 8px 0 rgba(0,0,0,.3); position: relative; }
  .cell { position: relative; aspect-ratio: 1; }
  .hole { position: absolute; inset: 9%; border-radius: 50%; background: #1b1446; box-shadow: inset 0 4px 8px rgba(0,0,0,.55); }
  .disc { position: absolute; inset: 9%; border-radius: 50%; z-index: 2; animation: drop .45s cubic-bezier(.45,0,.9,.6) both; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
  .disc::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; border: 3px solid rgba(255,255,255,.35); }
  @keyframes drop { 0% { transform: translateY(calc(var(--fall) * 100%)); } 75% { transform: translateY(0); } 88% { transform: translateY(-9%); } 100% { transform: translateY(0); } }
  .disc.win { animation: drop .01s both, glow .5s .1s infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 0 5px #fff, 0 0 22px 6px #fff; } }
  #ctl { display: flex; gap: 10px; padding-top: 10px; }
  #ctl button { border-radius: 20px; padding: 10px 14px; background: rgba(255,255,255,.18); font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 80px; }
  #ctl button span { font-size: 26px; line-height: 1.1; }
  #ctl #again { background: #ffd23f; color: #4a2a7a; box-shadow: 0 4px 0 #c9971a; }
</style>
</head>
<body>
<div id="app"><div class="stage" id="stage">
  <div id="score"></div>
  <div id="msg"></div>
  <div id="wrap"><div id="board"></div></div>
  <div id="ctl">
    <button id="mode"><span>🤖</span><i style="font-style:normal">Tegen computer</i></button>
    <button id="lvl"><span>😀</span><i style="font-style:normal">Makkelijk</i></button>
    <button id="again"><span>🔄</span>Nieuw spel</button>
  </div>
</div></div>
<script src="../shared.js"></script>
<script>
(() => {
  const A = Arcade;
  A.header('Vier op een rij');
  const R = 6, C = 7;
  const WIN = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const er = r + 3 * dr, ec = c + 3 * dc; if (er < 0 || er >= R || ec < 0 || ec >= C) continue;
    WIN.push([0, 1, 2, 3].map((k) => (r + k * dr) * C + c + k * dc));
  }
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  let b, turn, over, busy, starter = 2, mode = 'cpu', hard = false, scores = { 1: 0, 2: 0, d: 0 };
  const boardEl = document.getElementById('board'), msg = document.getElementById('msg'), scoreEl = document.getElementById('score');

  const winnerOf = (bd) => { for (const w of WIN) { const v = bd[w[0]]; if (v && v === bd[w[1]] && v === bd[w[2]] && v === bd[w[3]]) return { p: v, w }; } return null; };
  const drop = (bd, c, p) => { for (let r = R - 1; r >= 0; r--) if (!bd[r * C + c]) { bd[r * C + c] = p; return r * C + c; } return -1; };
  function score(bd, me) {
    let s = 0;
    for (const w of WIN) {
      let m = 0, o = 0; for (const i of w) { if (bd[i] === me) m++; else if (bd[i]) o++; }
      if (m && o) continue; if (m === 3) s += 5; else if (m === 2) s += 2; if (o === 3) s -= 6; else if (o === 2) s -= 1;
    }
    for (let r = 0; r < R; r++) if (bd[r * C + 3] === me) s += 3;
    return s;
  }
  function mm(bd, d, alpha, beta, t, me) {
    const w = winnerOf(bd); if (w) return w.p === me ? 100000 + d : -100000 - d;
    const moves = ORDER.filter((c) => !bd[c]); if (!moves.length || d === 0) return score(bd, me);
    const opp = me === 1 ? 2 : 1, nxt = t === me ? opp : me;
    let v = t === me ? -Infinity : Infinity;
    for (const c of moves) {
      const i = drop(bd, c, t), s = mm(bd, d - 1, alpha, beta, nxt, me); bd[i] = 0;
      if (t === me) { v = Math.max(v, s); alpha = Math.max(alpha, v); } else { v = Math.min(v, s); beta = Math.min(beta, v); }
      if (alpha >= beta) break;
    }
    return v;
  }
  function cpuPick() {
    const me = 2, opp = 1, moves = ORDER.filter((c) => !b[c]);
    for (const p of [me, opp]) for (const c of moves) { const i = drop(b, c, p), w = winnerOf(b); b[i] = 0; if (w) return c; } // win, else block
    if (!hard) return Math.random() < 0.7 ? moves[0] : A.rand(moves);
    let best = -Infinity, picks = [];
    for (const c of moves) { const i = drop(b, c, me), v = mm(b, 4, -Infinity, Infinity, opp, me); b[i] = 0; if (v > best) { best = v; picks = [c]; } else if (v === best) picks.push(c); }
    return A.rand(picks);
  }

  function build() {
    boardEl.innerHTML = '';
    for (let i = 0; i < R * C; i++) boardEl.insertAdjacentHTML('beforeend', '<div class="cell"><div class="hole"></div></div>');
  }
  const dot = (p) => `<span class="dot p${p}"></span>`;
  function drawScore() { scoreEl.innerHTML = `<div>${dot(1)}${scores[1]}</div><div>🤝 ${scores.d}</div><div>${dot(2)}${scores[2]}</div>`; }
  function say() { if (!over) msg.innerHTML = mode === 'cpu' ? (turn === 1 ? `Jouw beurt ${dot(1)}` : 'Even denken… 🤔') : `${dot(turn)} is aan de beurt!`; }

  function play(c) {
    const i = drop(b, c, turn); if (i < 0) return;
    const cell = boardEl.children[i], d = document.createElement('div');
    d.className = 'disc p' + turn; d.style.setProperty('--fall', -((i / C | 0) + 1.3)); cell.appendChild(d);
    busy = true; A.play('drop'); setTimeout(() => { busy = false; }, 480);
    const w = winnerOf(b);
    if (w) {
      over = true; scores[w.p]++; drawScore();
      setTimeout(() => w.w.forEach((k) => boardEl.children[k].querySelector('.disc').classList.add('win')), 500);
      if (mode === 'cpu' && w.p === 2) { msg.textContent = 'De computer wint! Probeer nog eens 💪'; setTimeout(() => A.play('wrong'), 450); }
      else { msg.innerHTML = mode === 'cpu' ? 'Jij wint! 🎉' : `${dot(w.p)} wint! 🎉`; setTimeout(() => { A.play('win'); A.confetti(); }, 500); }
      return;
    }
    if (b.every(Boolean)) { over = true; scores.d++; drawScore(); msg.textContent = 'Gelijkspel! 🤝'; return; }
    turn = turn === 1 ? 2 : 1; say();
    if (mode === 'cpu' && turn === 2) setTimeout(() => { if (!over) play(cpuPick()); }, 800);
  }
  function newGame() {
    b = Array(R * C).fill(0); over = false; busy = false; starter = starter === 1 ? 2 : 1; turn = starter; build(); drawScore(); say();
    if (mode === 'cpu' && turn === 2) setTimeout(() => { if (!over) play(cpuPick()); }, 800);
  }
  boardEl.addEventListener('pointerdown', (e) => {
    if (over || busy || (mode === 'cpu' && turn === 2)) return;
    const r = boardEl.getBoundingClientRect(), c = Math.max(0, Math.min(C - 1, Math.floor((e.clientX - r.left - 6) / ((r.width - 12) / C))));
    if (b[c]) { A.play('wrong'); return; } play(c);
  });
  document.getElementById('again').addEventListener('click', () => { A.play('tap'); newGame(); });
  document.getElementById('mode').addEventListener('click', () => {
    A.play('tap'); mode = mode === 'cpu' ? 'two' : 'cpu'; scores = { 1: 0, 2: 0, d: 0 }; starter = 2;
    const m = document.getElementById('mode'); m.querySelector('span').textContent = mode === 'cpu' ? '🤖' : '👫'; m.querySelector('i').textContent = mode === 'cpu' ? 'Tegen computer' : '2 spelers';
    document.getElementById('lvl').style.visibility = mode === 'cpu' ? 'visible' : 'hidden'; newGame();
  });
  document.getElementById('lvl').addEventListener('click', () => {
    A.play('tap'); hard = !hard; const l = document.getElementById('lvl'); l.querySelector('span').textContent = hard ? '🤓' : '😀'; l.querySelector('i').textContent = hard ? 'Moeilijk' : 'Makkelijk';
  });
  starter = 2; newGame();
  A.start({ emoji: '🔴', title: 'Vier op een rij', hint: 'Laat schijven vallen en zet er vier op een rij!' });
})();
</script>
</body>
</html>
